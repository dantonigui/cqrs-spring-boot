# Local development. Infra only: docker compose up -d --wait
# Infra + API: docker compose --profile app up --build -d --wait
name: cqrs

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks: [backend]

services:
  zookeeper:
    <<: *service-defaults
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: [CMD-SHELL, "cub zk-ready localhost:2181 5"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka:
    <<: *service-defaults
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  mysql-command:
    <<: *service-defaults
    image: mysql:8.0
    ports:
      - "127.0.0.1:${DB_COMMAND_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: cqrs_command
      MYSQL_USER: ${DB_COMMAND_USER:?Define DB_COMMAND_USER in .env}
      MYSQL_PASSWORD: ${DB_COMMAND_PASSWORD:?Define DB_COMMAND_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-command-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    stop_grace_period: 30s

  mysql-query:
    <<: *service-defaults
    image: mysql:8.0
    ports:
      - "127.0.0.1:${DB_QUERY_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: cqrs_query
      MYSQL_USER: ${DB_QUERY_USER:?Define DB_QUERY_USER in .env}
      MYSQL_PASSWORD: ${DB_QUERY_PASSWORD:?Define DB_QUERY_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-query-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    stop_grace_period: 30s

  redis:
    <<: *service-defaults
    image: redis:7.2-alpine
    init: true
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  app:
    <<: *service-defaults
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    env_file: .env
    environment:
      DB_COMMAND_URL_SQL: jdbc:mysql://mysql-command:3306/cqrs_command?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_QUERY_URL_SQL: jdbc:mysql://mysql-query:3306/cqrs_query?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -Duser.timezone=UTC"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      mysql-command:
        condition: service_healthy
      mysql-query:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://localhost:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    stop_grace_period: 30s
    mem_limit: 1g

networks:
  backend:
    driver: bridge

volumes:
  # Preserve names used by the previous Compose for existing MySQL data.
  mysql-command-data:
  mysql-query-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  redis-data:
